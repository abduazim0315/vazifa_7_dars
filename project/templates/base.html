<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    {% include 'components/_styles.html' %}

    <title>
        {{ title }}
    </title>
</head>
<body>

<div class="container">
        {% include 'layout/navbar.html' %}

        <div class="mt-5 mb-5 d-flex justify-content-between">
        <div class="col-3">
            <div class="list-group">
                {% for category in categories %}
                <a href="{% url 'car_by_brend' brend.id %}" class="list-group-item list-group-item-action">{{ category.name }}</a>
                {% endfor %}
            </div>
        </div>
        <div class="col-8">
           {% block content %}
            {% endblock content %}

        </div>
    </div>

        {% include 'layout/footer.html' %}
</div>


    {% include 'components/_scripts.html' %}

</body>
</html>
